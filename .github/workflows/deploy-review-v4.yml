name: Publish Ciudad Deportiva Review v4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-review-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and validate slide package
        shell: bash
        env:
          SLIDES_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-1ea4-820e-824d-2287a6a8cf66/raw?se=2026-10-22T14%3A05%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=ac918e0c-220f-5b03-8466-fb381153cf82&skoid=0a91ee30-885e-46c5-aa98-ae8c7359b1d8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-22T10%3A49%3A36Z&ske=2026-10-23T10%3A49%3A36Z&sks=b&skv=2026-02-06&sig=uSQ2PJZaqgNbMZyo9bfC0D71mf22p/kGwZ4MTXoG76o%3D"
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-all-errors "$SLIDES_URL" -o /tmp/slides-v4.zip
          rm -rf /tmp/slides-v4
          mkdir -p /tmp/slides-v4
          unzip -q /tmp/slides-v4.zip -d /tmp/slides-v4
          test "$(find /tmp/slides-v4 -maxdepth 1 -type f -name 'slide-*.jpg' | wc -l | tr -d ' ')" = "17"
          for n in $(seq -w 1 17); do test -s "/tmp/slides-v4/slide-${n}.jpg"; done

      - name: Replace portal slides and bust cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p slides
          cp /tmp/slides-v4/slide-*.jpg slides/
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          version = '20261022-v4'
          s = re.sub(r'slides/slide-01\.jpg(?:\?v=[^"\']+)?', f'slides/slide-01.jpg?v={version}', s)
          s = re.sub(r"'slides/slide-' \+ pad \+ '\.jpg(?:\?v=[^']+)?'", f"'slides/slide-' + pad + '.jpg?v={version}'", s)
          s = re.sub(r'<div class="topbar-badge">.*?</div>', '<div class="topbar-badge">REVIEW v4 · ACTUALIZADO</div>', s, count=1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit published version and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/deploy-review-v4.yml
          git add index.html slides/slide-*.jpg
          git commit -m "Publish Ciudad Deportiva review v4 slides"
          git push origin HEAD:main
